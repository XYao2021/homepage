name: Deploy site to GitHub Pages

# Builds the Jekyll site on every push to main and publishes the generated
# HTML to the `gh-pages` branch, which GitHub Pages serves at
# https://xyao2021.github.io/homepage/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true

      # GitHub does not always auto-enable Pages when gh-pages is created, so
      # try to enable it via the API. Skips if already enabled; tolerated if the
      # token lacks permission (then enable once in Settings > Pages).
      - name: Enable GitHub Pages from gh-pages branch (first run only)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "Pages already enabled"
          else
            gh api -X POST "repos/${{ github.repository }}/pages" \
              -f build_type=legacy -f 'source[branch]=gh-pages' -f 'source[path]=/'
          fi
